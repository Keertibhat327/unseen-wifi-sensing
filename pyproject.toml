[project]
name = "csi-sentinel"
version = "0.1.0"
description = "Hardware-ready, privacy-first Wi-Fi CSI research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.5,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0.36,<3",
  "pydantic>=2.10,<3", "numpy>=2.1,<3", "httpx>=0.28,<1",
  "pyserial>=3.5,<4", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
ml = ["scikit-learn>=1.5,<2", "torch>=2.5,<3", "matplotlib>=3.9,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "contracts*", "detection*", "gateway*", "simulator*", "ml*", "research*", "identity*"]

[tool.vercel]
entrypoint = "backend.api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".deploy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
